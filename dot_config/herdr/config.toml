# This file is managed by chezmoi. Do not edit directly.
[theme]
name = "solarized"
auto_switch = true

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
prompt_new_tab_name = false

[terminal]
shell_mode = "login"
new_cwd = "home"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "bead-dispatcher.select-ready"
description = "open dispatch selector"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "bead-dispatcher.dispatch-ready"
description = "dispatch all ready beads"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr plugin pane open --plugin bead-dispatcher --entrypoint board"
description = "open beads board"

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[experimental]
pane_history = true
