# This file is managed by chezmoi. Do not edit directly.
[theme]
name = "solarized"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "bead-dispatcher.select-ready"
description = "select and dispatch a ready bead"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "bead-dispatcher.dispatch-ready"
description = "dispatch all ready beads"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr plugin pane open --plugin bead-dispatcher --entrypoint board"
description = "open beads board"

[experimental]
pane_history = true
